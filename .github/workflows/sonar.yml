name: SonarQube

on:
  # SonarQube Cloud's free plan analyses only the main branch and pull requests.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    # The scan step is skipped until SONAR_TOKEN is set in the repository
    # secrets; tests with coverage still run.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # Pinned, not "ubuntu-latest": GitHub is migrating that label from
    # 24.04 to 26.04 starting 2026-10-19.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history enables blame information and new-code detection.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Not 20 like ci.yml: node:test's lcov reporter and source-mapped
          # coverage of .ts files need a newer Node.
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # lcov SF: paths are relative to the repo root, so Sonar resolves them as is.
        run: npm run test:coverage

      - name: Run SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          # Not a secret: the public SonarCloud endpoint.
          SONAR_HOST_URL: https://sonarcloud.io
