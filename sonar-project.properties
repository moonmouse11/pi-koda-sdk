# SonarQube / SonarCloud project configuration.
# Secrets (SONAR_TOKEN) live in the GitHub repository settings.

sonar.projectKey=moonmouse11_pi-koda-sdk
sonar.organization=moonmouse11

# extensions/ is the Pi entry point, .github is CI attack surface
sonar.sources=src,extensions,package.json,.github
sonar.tests=test

# lcov.info produced by `npm run test:coverage` in CI (see .github/workflows/sonar.yml)
sonar.javascript.lcov.reportPaths=lcov.info

# Fail the build when the Quality Gate fails.
sonar.qualitygate.wait=true

sonar.sourceEncoding=UTF-8
